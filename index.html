<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="300">
    <title>Inteligencia Comercial - Live Monitor v3.9</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { 
            --bg: #05070a; --panel: #0d1117; --neon: #00ff9d; --red: #ff4757; 
            --blue: #00d2ff; --text: #ffffff; --sub: #8b949e; --border: rgba(255, 255, 255, 0.08); 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }
        
        body { 
            height: 100vh; width: 100vw; background: var(--bg); color: var(--text); 
            font-family: 'Plus Jakarta Sans', sans-serif; display: flex; 
            align-items: center; justify-content: center; overflow: hidden; padding: 30px; 
        }
        
        #wrapper { width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 2vh; }
        header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 1vh; border-bottom: 1px solid var(--border); }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 3vh; color: var(--neon); text-shadow: 0 0 15px rgba(0,255,157,0.3); }

        .main-grid { display: grid; grid-template-columns: 0.7fr 1.3fr; gap: 2vw; overflow: hidden; }
        .glass-panel { background: var(--panel); border-radius: 20px; border: 1px solid var(--border); padding: 2vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .table-container { flex: 1; overflow-y: auto; scrollbar-width: none; width: 100%; position: relative; }
        .table-container::-webkit-scrollbar { display: none; }

        .table-wrapper { width: 100%; margin-bottom: 10px; position: relative; padding-left: 55px; }
        
        .zona-tag {
            position: absolute; left: 0; top: 0; bottom: 0; width: 45px;
            background: rgba(0, 210, 255, 0.1); border-left: 5px solid var(--blue);
            display: flex; align-items: center; justify-content: center; border-radius: 4px;
        }
        .zona-tag span { 
            transform: rotate(270deg); white-space: nowrap; font-family: 'Orbitron'; 
            font-weight: 900; color: var(--blue); font-size: 1.4vh; letter-spacing: 2px;
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0 4px; table-layout: fixed; }
        th { font-family: 'Orbitron', sans-serif; font-size: 0.85vh; color: var(--sub); text-transform: uppercase; padding: 5px 10px; }
        
        .col-ruta { width: 28%; text-align: left !important; }
        .col-data { width: 18%; text-align: right !important; }

        .ruta-row td { background: rgba(255,255,255,0.02); padding: 0.8vh 12px; font-size: 1.15vh; border-bottom: 1px solid rgba(255,255,255,0.01); }
        .ruta-name { font-weight: 800; color: #fff; text-align: left; }
        .ruta-val { text-align: right; }

        .total-bar { 
            margin-top: 1vh; background: var(--neon); color: #000; padding: 1.2vh 20px; border-radius: 8px; 
            display: flex; justify-content: space-between; align-items: center;
            font-family: 'Orbitron', sans-serif; font-weight: 950; font-size: 1.3vh;
        }
        .total-bar .val-group { display: flex; gap: 3vw; }

        .footer-stats { display: flex; gap: 2vw; justify-content: center; padding-top: 1vh; }
        .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 1.5vh 3vw; text-align: center; min-width: 220px; }
        .stat-card .val { font-family: 'Orbitron'; font-size: 3.8vh; color: var(--neon); }
        .stat-card .lbl { font-size: 1vh; color: var(--sub); text-transform: uppercase; font-weight: 700; margin-top: 5px; }
        .stat-card.blue .val { color: var(--blue); }
        .stat-card.warning .val { color: var(--red); text-shadow: 0 0 10px rgba(255,71,87,0.4); }
    </style>
</head>
<body>
    <div id="wrapper">
        <header>
            <div class="h-left"><h1>INTELIGENCIA COMERCIAL - <span id="cedis-label">...</span></h1></div>
            <div id="date-tag" style="font-family: 'Orbitron'; color: var(--blue); font-size: 1.3vh; border: 1px solid var(--blue); padding: 4px 18px; border-radius: 5px;">LIVE FEED</div>
        </header>

        <div class="main-grid">
            <div class="glass-panel"><canvas id="bulletChart"></canvas></div>
            <div class="glass-panel">
                <div class="table-container" id="content-tables"></div>
                <div class="total-bar">
                    <span>TOTAL CEDIS</span>
                    <div class="val-group">
                        <span id="t-obj">$0</span><span id="t-vta">$0</span><span id="t-esp">$0</span><span id="t-cuota">$0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-stats">
            <div id="card-perc" class="stat-card"><div class="val" id="global-perc">0%</div><div class="lbl">Avance Quincenal</div></div>
            <div class="stat-card blue"><div class="val" id="global-expected">0%</div><div class="lbl">Avance Esperado</div></div>
            <div class="stat-card"><div class="val" id="global-sug">$0</div><div class="lbl">Meta Diaria de Rescate</div></div>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxbA3JbYpdUJXXuUa3iicabHZ01QS98A610ugAgMRI7laj6B69ptMs6rG7Ot-pSIkaUe-stVIzL7BY/pub?gid=920388459&single=true&output=csv';
        const urlParams = new URLSearchParams(window.location.search);
        const filtradoCedis = urlParams.get('cedis');

        function clean(v) { return v ? parseFloat(v.toString().replace(/[$, ]/g, '')) || 0 : 0; }
        function fmt(n) { return '$' + Math.round(n).toLocaleString('en-US'); }

        Papa.parse(csvUrl, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res) {
                const dataRaw = res.data;
                const h = Object.keys(dataRaw[0]);
                const findK = (terms) => h.find(k => terms.some(t => k.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().includes(t.toUpperCase())));
                const cKey = findK(['CEDIS']), rKey = findK(['RUTA']), zKey = findK(['ZONA']), vKey = findK(['ORGANICA']), oKey = findK(['OBJETIVO']), eKey = findK(['ESPERADA']), sKey = findK(['FALTANTES', 'CUOTA']);

                const targetCedis = filtradoCedis || dataRaw[0][cKey];
                let data = dataRaw.filter(row => row[cKey]?.trim().toUpperCase() === targetCedis?.toUpperCase() && row[rKey]?.trim());
                document.getElementById('cedis-label').innerText = targetCedis?.toUpperCase();

                const grouped = data.reduce((acc, row) => {
                    const zona = row[zKey] || '1';
                    if (!acc[zona]) acc[zona] = [];
                    acc[zona].push(row);
                    return acc;
                }, {});

                const container = document.getElementById('content-tables');
                container.innerHTML = "";
                let tObj = 0, tVta = 0, tEsp = 0, tSug = 0;

                Object.keys(grouped).sort().forEach(zona => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'table-wrapper';
                    wrapper.innerHTML = `<div class="zona-tag"><span>ZONA ${zona}</span></div>`;
                    
                    const table = document.createElement('table');
                    table.innerHTML = `<thead><tr><th class="col-ruta">Ruta</th><th class="col-data">Meta</th><th class="col-data">Venta</th><th class="col-data">Ideal</th><th class="col-data">Cuota</th></tr></thead><tbody></tbody>`;
                    const tbody = table.querySelector('tbody');

                    grouped[zona].forEach(item => {
                        const o = clean(item[oKey]), v = clean(item[vKey]), e = clean(item[eKey]), s = clean(item[sKey]);
                        tObj += o; tVta += v; tEsp += e; tSug += s;
                        const vColor = (v < e) ? 'var(--red)' : 'var(--neon)';
                        
                        const row = document.createElement('tr'); row.className = 'ruta-row';
                        row.innerHTML = `<td class="ruta-name">${item[rKey]}</td><td class="ruta-val">${fmt(o)}</td><td class="ruta-val" style="color:${vColor};font-weight:800">${fmt(v)}</td><td class="ruta-val">${fmt(e)}</td><td class="ruta-val" style="color:var(--blue);font-weight:800">${fmt(s)}</td>`;
                        tbody.appendChild(row);
                    });
                    wrapper.appendChild(table);
                    container.appendChild(wrapper);
                });

                document.getElementById('t-obj').innerText = fmt(tObj);
                document.getElementById('t-vta').innerText = fmt(tVta);
                document.getElementById('t-esp').innerText = fmt(tEsp);
                document.getElementById('t-cuota').innerText = fmt(tSug);

                const percVta = Math.round((tVta/tObj)*100);
                const percEsp = Math.round((tEsp/tObj)*100);
                
                document.getElementById('global-perc').innerText = percVta + '%';
                document.getElementById('global-expected').innerText = percEsp + '%';
                document.getElementById('global-sug').innerText = fmt(tSug);

                if (percVta < percEsp) { document.getElementById('card-perc').classList.add('warning'); }
                else { document.getElementById('card-perc').classList.remove('warning'); }

                new Chart(document.getElementById('bulletChart'), {
                    data: {
                        labels: data.map(r => r[rKey]),
                        datasets: [
                            { type: 'bar', data: data.map(r => clean(r[oKey])), backgroundColor: 'rgba(255,255,255,0.05)', barPercentage: 0.9, order: 3 },
                            { type: 'bar', data: data.map(r => clean(r[vKey])), backgroundColor: data.map(r => clean(r[vKey]) < clean(r[eKey]) ? '#ff4757' : '#00ff9d'), barPercentage: 0.5, borderRadius: 3, order: 2 },
                            { type: 'line', data: data.map(r => clean(r[eKey])), backgroundColor: '#fff', borderColor: '#fff', showLine: false, pointStyle: 'line', rotation: 90, pointRadius: 8, pointBorderWidth: 2, order: 1 }
                        ]
                    },
                    options: {
                        indexAxis: 'y', responsive: true, maintainAspectRatio: false, grouped: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { size: 9 } } },
                            y: { grid: { display: false }, ticks: { color: '#fff', font: { weight: 700, size: 9.5 } } }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
