<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="300">
    <title>Gusi Intelligence - Live Monitor v3.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { --bg: #05070a; --panel: #0d1117; --neon: #00ff9d; --blue: #00d2ff; --text: #ffffff; --sub: #8b949e; --border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { height: 100vh; width: 100vw; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        #wrapper { width: 97vw; height: 95vh; display: grid; grid-template-rows: auto 1fr auto; gap: 2vh; }
        
        header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 1.5vh; border-bottom: 1px solid var(--border); }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 3.2vh; color: var(--neon); text-shadow: 0 0 15px rgba(0,255,157,0.3); }

        .main-grid { display: grid; grid-template-columns: 0.7fr 1.3fr; gap: 2vw; overflow: hidden; }
        .glass-panel { background: var(--panel); border-radius: 20px; border: 1px solid var(--border); padding: 2vh; display: flex; flex-direction: column; }
        
        /* Contenedor de tabla optimizado */
        .table-container { 
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .table-container::-webkit-scrollbar { display: none; }

        /* Sistema de columnas para León */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr; /* 1 columna por defecto */
            gap: 2vw;
        }
        .grid-layout.multi { grid-template-columns: 1fr 1fr; } /* 2 columnas si hay muchas rutas */

        table { width: 100%; border-collapse: separate; border-spacing: 0 4px; table-layout: fixed; }
        th { font-family: 'Orbitron', sans-serif; font-size: 0.8vh; color: var(--sub); text-transform: uppercase; padding: 0.5vh; text-align: right; }
        th:first-child { text-align: left; width: 30%; }
        
        .zona-header td { background: rgba(0, 210, 255, 0.1); color: var(--blue); font-weight: 800; font-size: 1.1vh; padding: 8px 12px; border-left: 3px solid var(--blue); text-align: left !important; }
        
        .ruta-row td { background: rgba(255,255,255,0.02); padding: 0.9vh 8px; text-align: right; font-size: 1.1vh; border-top: 1px solid rgba(255,255,255,0.03); white-space: nowrap; }
        .ruta-row td:first-child { text-align: left; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; }

        /* Fila de Totales fija abajo */
        .total-bar { 
            margin-top: 1vh;
            background: var(--neon); 
            color: #000; 
            padding: 1.2vh 20px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.3vh;
        }

        .footer-stats { display: flex; gap: 2vw; justify-content: center; padding-top: 1vh; }
        .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 1.5vh 3vw; text-align: center; min-width: 220px; }
        .stat-card .val { font-family: 'Orbitron'; font-size: 3.5vh; color: var(--neon); }
        .stat-card .lbl { font-size: 1vh; color: var(--sub); text-transform: uppercase; font-weight: 700; margin-top: 5px; }
        .stat-card.blue .val { color: var(--blue); }
    </style>
</head>
<body>
    <div id="wrapper">
        <header>
            <div class="h-left"><h1>OPERACIONES <span id="cedis-label">...</span></h1></div>
            <div id="date-tag" style="font-family: 'Orbitron'; color: var(--blue); font-size: 1.4vh; border: 1px solid var(--blue); padding: 5px 15px; border-radius: 4px;">01-MAY</div>
        </header>

        <div class="main-grid">
            <div class="glass-panel"><canvas id="bulletChart"></canvas></div>
            
            <div class="glass-panel">
                <div class="table-container">
                    <div id="table-grid" class="grid-layout">
                        <!-- Las tablas se generan aquí -->
                    </div>
                </div>
                <!-- Fila de totales recuperada y estilizada -->
                <div class="total-bar" id="total-row-div">
                    <span>TOTAL CEDIS</span>
                    <span id="t-obj">$0</span>
                    <span id="t-vta">$0</span>
                    <span id="t-esp">$0</span>
                    <span id="t-cuota">$0</span>
                </div>
            </div>
        </div>

        <div class="footer-stats">
            <div class="stat-card"><div class="val" id="global-perc">0%</div><div class="lbl">Avance Quincenal</div></div>
            <div class="stat-card blue"><div class="val" id="global-expected">0%</div><div class="lbl">Avance Esperado</div></div>
            <div class="stat-card"><div class="val" id="global-sug">$0</div><div class="lbl">Meta Diaria de Rescate</div></div>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxbA3JbYpdUJXXuUa3iicabHZ01QS98A610ugAgMRI7laj6B69ptMs6rG7Ot-pSIkaUe-stVIzL7BY/pub?gid=920388459&single=true&output=csv';
        const urlParams = new URLSearchParams(window.location.search);
        const filtradoCedis = urlParams.get('cedis');

        function clean(v) { return v ? parseFloat(v.toString().replace(/[$, ]/g, '')) || 0 : 0; }
        function fmt(n) { return '$' + Math.round(n).toLocaleString('en-US'); }

        Papa.parse(csvUrl, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res) {
                const dataRaw = res.data;
                const h = Object.keys(dataRaw[0]);
                const findK = (terms) => h.find(k => terms.some(t => k.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().includes(t.toUpperCase())));
                
                const cKey = findK(['CEDIS']), rKey = findK(['RUTA']), zKey = findK(['ZONA']), vKey = findK(['ORGANICA']), oKey = findK(['OBJETIVO']), eKey = findK(['ESPERADA']), sKey = findK(['FALTANTES', 'CUOTA']);

                const targetCedis = filtradoCedis || dataRaw[0][cKey];
                let data = dataRaw.filter(row => row[cKey]?.trim().toUpperCase() === targetCedis?.toUpperCase() && row[rKey]?.trim());
                
                document.getElementById('cedis-label').innerText = targetCedis?.toUpperCase();

                const grid = document.getElementById('table-grid');
                const isMulti = data.length > 12;
                if (isMulti) grid.classList.add('multi');

                const grouped = data.reduce((acc, row) => {
                    const zona = row[zKey] || '1';
                    if (!acc[zona]) acc[zona] = [];
                    acc[zona].push(row);
                    return acc;
                }, {});

                let tObj = 0, tVta = 0, tEsp = 0, tSug = 0;
                let currentTableBody;
                
                // Generar contenido
                Object.keys(grouped).sort().forEach((zona, idx) => {
                    // Si es multi-columna, decidimos en qué tabla poner la zona
                    if (!isMulti || idx === 0 || idx === Math.ceil(Object.keys(grouped).length / 2)) {
                        const table = document.createElement('table');
                        table.innerHTML = `<thead><tr><th style="text-align:left">Zona ${zona}</th><th>Meta</th><th>Venta</th><th>Ideal</th><th>Cuota</th></tr></thead><tbody></tbody>`;
                        grid.appendChild(table);
                        currentTableBody = table.querySelector('tbody');
                    }

                    grouped[zona].forEach(item => {
                        const o = clean(item[oKey]), v = clean(item[vKey]), e = clean(item[eKey]), s = clean(item[sKey]);
                        tObj += o; tVta += v; tEsp += e; tSug += s;
                        const row = document.createElement('tr'); row.className = 'ruta-row';
                        row.innerHTML = `<td>${item[rKey]}</td><td>${fmt(o)}</td><td style="color:var(--neon);font-weight:800">${fmt(v)}</td><td>${fmt(e)}</td><td style="color:var(--blue);font-weight:800">${fmt(s)}</td>`;
                        currentTableBody.appendChild(row);
                    });
                });

                // Totales
                document.getElementById('t-obj').innerText = fmt(tObj);
                document.getElementById('t-vta').innerText = fmt(tVta);
                document.getElementById('t-esp').innerText = fmt(tEsp);
                document.getElementById('t-cuota').innerText = fmt(tSug);

                document.getElementById('global-perc').innerText = Math.round((tVta/tObj)*100) + '%';
                document.getElementById('global-expected').innerText = Math.round((tEsp/tObj)*100) + '%';
                document.getElementById('global-sug').innerText = fmt(tSug);

                new Chart(document.getElementById('bulletChart'), {
                    data: {
                        labels: data.map(r => r[rKey]),
                        datasets: [
                            { type: 'bar', data: data.map(r => clean(r[oKey])), backgroundColor: 'rgba(255,255,255,0.05)', barPercentage: 0.85, order: 3 },
                            { type: 'bar', data: data.map(r => clean(r[vKey])), backgroundColor: '#00ff9d', barPercentage: 0.5, borderRadius: 4, order: 2 },
                            { type: 'line', data: data.map(r => clean(r[eKey])), backgroundColor: '#fff', borderColor: '#fff', showLine: false, pointStyle: 'line', rotation: 90, pointRadius: 10, pointBorderWidth: 2, order: 1 }
                        ]
                    },
                    options: {
                        indexAxis: 'y', responsive: true, maintainAspectRatio: false, grouped: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { size: 9 } } },
                            y: { grid: { display: false }, ticks: { color: '#fff', font: { weight: 700, size: 10 } } }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
