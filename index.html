<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="300">
    <title>Gusi Intelligence - Live Monitor v3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { --bg: #05070a; --panel: #0d1117; --neon: #00ff9d; --blue: #00d2ff; --text: #ffffff; --sub: #8b949e; --border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { height: 100vh; width: 100vw; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #wrapper { width: 98vw; height: 96vh; display: grid; grid-template-rows: auto 1fr auto; gap: 1.5vh; }
        
        header { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 1vh; border-bottom: 1px solid var(--border); }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 3vh; color: var(--neon); text-shadow: 0 0 15px rgba(0,255,157,0.3); }

        .main-grid { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 1.5vw; overflow: hidden; }
        .glass-panel { background: var(--panel); border-radius: 15px; border: 1px solid var(--border); padding: 1.5vh; overflow: hidden; }
        
        /* Ajuste Dinámico de Tabla para CEDIS Grandes como León */
        .table-container { 
            display: block;
            column-count: 1; /* Por defecto 1 columna */
            column-gap: 2vw;
            overflow-y: auto;
            scrollbar-width: none;
        }
        /* Si hay más de 12 rutas, dividimos en 2 columnas */
        .multi-column { column-count: 2 !important; } 

        table { width: 100%; border-collapse: separate; border-spacing: 0 4px; break-inside: avoid; }
        th { font-family: 'Orbitron', sans-serif; font-size: 0.8vh; color: var(--sub); text-transform: uppercase; padding: 0.5vh; text-align: right; }
        th:first-child { text-align: left; }
        
        .zona-header td { background: rgba(0, 210, 255, 0.1); color: var(--blue); font-weight: 800; font-size: 1.1vh; padding: 6px 10px; border-left: 3px solid var(--blue); text-align: left !important; }
        .ruta-row td { background: rgba(255,255,255,0.02); padding: 0.8vh; text-align: right; font-size: 1.1vh; border-top: 1px solid rgba(255,255,255,0.03); }
        .ruta-row td:first-child { text-align: left; font-weight: 700; color: #fff; }

        .footer-stats { display: flex; gap: 1.5vw; justify-content: center; }
        .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1vh 2vw; text-align: center; min-width: 180px; }
        .stat-card .val { font-family: 'Orbitron'; font-size: 3vh; color: var(--neon); }
        .stat-card .lbl { font-size: 0.9vh; color: var(--sub); text-transform: uppercase; font-weight: 700; margin-top: 3px; }
        .stat-card.blue .val { color: var(--blue); }
    </style>
</head>
<body>
    <div id="wrapper">
        <header>
            <div class="h-left"><h1>OPERACIONES <span id="cedis-label">...</span></h1></div>
            <div id="date-tag" style="font-family: 'Orbitron'; color: var(--blue); font-size: 1.2vh; border: 1px solid var(--blue); padding: 4px 12px; border-radius: 4px;">LIVE FEED</div>
        </header>
        <div class="main-grid">
            <div class="glass-panel"><canvas id="bulletChart"></canvas></div>
            <div class="glass-panel table-container" id="dynamic-table-container">
                <table id="dataTable">
                    <thead>
                        <tr><th style="text-align: left;">Zona / Ruta</th><th>Meta</th><th>Venta</th><th>Ideal</th><th>Cuota</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="footer-stats">
            <div class="stat-card"><div class="val" id="global-perc">0%</div><div class="lbl">Avance Quincenal</div></div>
            <div class="stat-card blue"><div class="val" id="global-expected">0%</div><div class="lbl">Avance Esperado</div></div>
            <div class="stat-card"><div class="val" id="global-sug">$0</div><div class="lbl">Meta Diaria de Rescate</div></div>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxbA3JbYpdUJXXuUa3iicabHZ01QS98A610ugAgMRI7laj6B69ptMs6rG7Ot-pSIkaUe-stVIzL7BY/pub?gid=920388459&single=true&output=csv';
        const urlParams = new URLSearchParams(window.location.search);
        const filtradoCedis = urlParams.get('cedis');

        function clean(v) { return v ? parseFloat(v.toString().replace(/[$, ]/g, '')) || 0 : 0; }
        function fmt(n) { return '$' + Math.round(n).toLocaleString('en-US'); }

        Papa.parse(csvUrl, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res) {
                const dataRaw = res.data;
                const h = Object.keys(dataRaw[0]);
                const findK = (terms) => h.find(k => terms.some(t => k.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().includes(t.toUpperCase())));
                
                const cKey = findK(['CEDIS']), rKey = findK(['RUTA']), zKey = findK(['ZONA']), vKey = findK(['ORGANICA']), oKey = findK(['OBJETIVO']), eKey = findK(['ESPERADA']), sKey = findK(['FALTANTES', 'CUOTA']);

                const targetCedis = filtradoCedis || dataRaw[0][cKey];
                let data = dataRaw.filter(row => row[cKey]?.trim().toUpperCase() === targetCedis?.toUpperCase() && row[rKey]?.trim());
                
                document.getElementById('cedis-label').innerText = targetCedis?.toUpperCase();

                // Lógica de Columnas Dinámicas para León u otros CEDIS grandes
                const container = document.getElementById('dynamic-table-container');
                if (data.length > 12) { container.classList.add('multi-column'); }

                const grouped = data.reduce((acc, row) => {
                    const zona = row[zKey] || '1';
                    if (!acc[zona]) acc[zona] = [];
                    acc[zona].push(row);
                    return acc;
                }, {});

                const tbody = document.getElementById('tableBody');
                let tObj = 0, tVta = 0, tEsp = 0, tSug = 0;

                Object.keys(grouped).sort().forEach(zona => {
                    const zRow = document.createElement('tr'); zRow.className = 'zona-header';
                    zRow.innerHTML = `<td colspan="5">ZONA ${zona}</td>`;
                    tbody.appendChild(zRow);
                    grouped[zona].forEach(item => {
                        const o = clean(item[oKey]), v = clean(item[vKey]), e = clean(item[eKey]), s = clean(item[sKey]);
                        tObj += o; tVta += v; tEsp += e; tSug += s;
                        const row = document.createElement('tr'); row.className = 'ruta-row';
                        row.innerHTML = `<td>${item[rKey]}</td><td>${fmt(o)}</td><td style="color:var(--neon);font-weight:800">${fmt(v)}</td><td>${fmt(e)}</td><td style="color:var(--blue);font-weight:800">${fmt(s)}</td>`;
                        tbody.appendChild(row);
                    });
                });

                // Indicadores Globales con Avance Esperado
                document.getElementById('global-perc').innerText = Math.round((tVta/tObj)*100) + '%';
                document.getElementById('global-expected').innerText = Math.round((tEsp/tObj)*100) + '%';
                document.getElementById('global-sug').innerText = fmt(tSug);

                new Chart(document.getElementById('bulletChart'), {
                    data: {
                        labels: data.map(r => r[rKey]),
                        datasets: [
                            { type: 'bar', data: data.map(r => clean(r[oKey])), backgroundColor: 'rgba(255,255,255,0.05)', barPercentage: 0.85, order: 3 },
                            { type: 'bar', data: data.map(r => clean(r[vKey])), backgroundColor: '#00ff9d', barPercentage: 0.5, borderRadius: 4, order: 2 },
                            { type: 'line', data: data.map(r => clean(r[eKey])), backgroundColor: '#fff', borderColor: '#fff', showLine: false, pointStyle: 'line', rotation: 90, pointRadius: 12, pointBorderWidth: 3, order: 1 }
                        ]
                    },
                    options: {
                        indexAxis: 'y', responsive: true, maintainAspectRatio: false, grouped: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b', font: { size: 9 } } },
                            y: { grid: { display: false }, ticks: { color: '#fff', font: { weight: 700, size: 11 } } }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
