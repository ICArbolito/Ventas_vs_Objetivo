<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="300">
    <title>Monitoreo Gerencial - Arbolito</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { 
            --bg: #f1f5f9; 
            --panel: #ffffff; 
            --accent-data: #3b82f6; 
            --accent-success: #10b981; 
            --accent-warning: #f59e0b;
            --accent-alert: #ef4444; 
            --text-main: #0f172a; 
            --text-sub: #94a3b8;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -1px rgba(0,0,0,0.04);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }
        
        body { 
            height: 100vh; width: 100vw; background: var(--bg); color: var(--text-main); 
            font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; 
            overflow: hidden; 
            padding: 2vh 2.5vw;
        }
        
        #wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 2vh; }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--panel); padding: 1.5vh 2.5vw; border-radius: 16px;
            box-shadow: var(--shadow);
        }
        h1 { font-family: 'Rubik', sans-serif; font-size: 2.2vh; font-weight: 700; letter-spacing: -0.3px; color: var(--text-main); }
        h1 span { color: var(--accent-data); font-weight: 900; }

        /* === KPIs GLOBALES === */
        .global-kpis { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5vw;
        }
        .kpi-card {
            background: var(--panel); border-radius: 16px; padding: 2.5vh 2vw; 
            box-shadow: var(--shadow); position: relative;
            border-left: 4px solid var(--accent-data);
        }
        .kpi-card.success { border-left-color: var(--accent-success); }
        .kpi-card.warning { border-left-color: var(--accent-warning); }
        .kpi-card.danger { border-left-color: var(--accent-alert); }
        
        .kpi-label { 
            font-size: 0.9vh; color: var(--text-muted); text-transform: uppercase; 
            font-weight: 600; letter-spacing: 1px; margin-bottom: 1vh;
        }
        .kpi-value { 
            font-family: 'Rubik'; font-size: 3.8vh; font-weight: 700; 
            color: var(--text-main); margin-bottom: 1.5vh;
            white-space: nowrap;
        }
        
        /* Barra de progreso KPI */
        .kpi-progress {
            height: 6px; background: #f1f5f9; border-radius: 3px;
            overflow: hidden; margin-bottom: 1vh;
        }
        .kpi-progress-fill {
            height: 100%; border-radius: 3px; transition: width 0.8s ease;
        }
        .kpi-progress-fill.success { background: linear-gradient(90deg, #10b981, #34d399); }
        .kpi-progress-fill.warning { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .kpi-progress-fill.danger { background: linear-gradient(90deg, #ef4444, #f87171); }
        .kpi-progress-fill.data { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        
        .kpi-delta {
            display: flex; align-items: center; gap: 0.5vw;
            font-size: 1.1vh; font-weight: 600;
        }
        .delta-value { color: var(--text-main); font-weight: 700; }
        .delta-label { color: var(--text-muted); }
        
        .kpi-footer {
            margin-top: 1vh; padding-top: 1vh; border-top: 1px solid var(--border);
            font-size: 0.95vh; color: var(--text-muted);
        }
        .kpi-footer strong { color: var(--text-main); }

        /* === GRID DE CEDIS === */
        .cedis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5vh;
            overflow-y: auto;
            padding-right: 0.5vh;
        }
        .cedis-grid::-webkit-scrollbar { width: 4px; }
        .cedis-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .cedis-card {
            background: var(--panel); border-radius: 16px; padding: 2vh 1.5vw;
            box-shadow: var(--shadow); position: relative;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .cedis-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        .cedis-card.critical { border-left: 3px solid var(--accent-alert); }
        .cedis-card.on-track { border-left: 3px solid var(--accent-success); }
        .cedis-card.warning { border-left: 3px solid var(--accent-warning); }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5vh;
        }
        .cedis-name {
            font-family: 'Rubik'; font-size: 1.8vh; font-weight: 700; color: var(--text-main);
        }
        .status-badge {
            padding: 3px 10px; border-radius: 20px; font-size: 0.85vh; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .status-badge.critical { background: rgba(239, 68, 68, 0.08); color: var(--accent-alert); }
        .status-badge.on-track { background: rgba(16, 185, 129, 0.08); color: var(--accent-success); }
        .status-badge.warning { background: rgba(245, 158, 11, 0.08); color: var(--accent-warning); }

        /* === SPARKLINE === */
        .sparkline-container {
            height: 40px; margin: 1vh 0;
            position: relative;
        }
        .sparkline-svg {
            width: 100%; height: 100%;
        }
        .sparkline-line {
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .sparkline-area {
            opacity: 0.1;
        }
        .sparkline-dot {
            r: 2;
            stroke-width: 1;
        }

        /* === BULLET CHART MINI === */
        .bullet-container { margin: 1.5vh 0; }
        .bullet-labels {
            display: flex; justify-content: space-between; font-size: 0.95vh;
            color: var(--text-muted); margin-bottom: 0.8vh; font-weight: 500;
        }
        .bullet-chart {
            height: 28px; background: #f1f5f9; border-radius: 4px;
            position: relative; overflow: hidden;
        }
        .bullet-bar {
            position: absolute; height: 100%; transition: width 0.6s ease;
        }
        .bullet-expected { 
            background: repeating-linear-gradient(
                45deg,
                rgba(59, 130, 246, 0.1),
                rgba(59, 130, 246, 0.1) 6px,
                rgba(59, 130, 246, 0.2) 6px,
                rgba(59, 130, 246, 0.2) 12px
            );
            border-right: 2px solid var(--accent-data);
        }
        .bullet-actual {
            background: linear-gradient(90deg, var(--accent-success), #34d399);
            z-index: 10;
            border-radius: 4px 0 0 4px;
        }
        .bullet-actual.short {
            background: linear-gradient(90deg, var(--accent-alert), #f87171);
        }

        /* === METRICS ROW === */
        .metrics-row {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1vw;
            margin-top: 1.5vh; padding-top: 1.5vh; border-top: 1px solid var(--border);
        }
        .metric { text-align: center; }
        .metric-value {
            font-family: 'Rubik'; font-size: 1.5vh; font-weight: 700;
            color: var(--text-main); margin-bottom: 0.3vh;
        }
        .metric-label { font-size: 0.8vh; color: var(--text-muted); text-transform: uppercase; font-weight: 500; letter-spacing: 0.5px; }
        .metric-value.rescue { color: var(--accent-warning); }
        .metric-value.sales.on-target { color: var(--accent-success); }
        .metric-value.sales.off-target { color: var(--accent-alert); }
        .metric-value.goal { color: var(--text-muted); }

        .source-footer { 
            text-align: center; font-size: 0.75vh; color: var(--text-muted); 
            font-weight: 500; padding: 0.5vh; text-transform: uppercase; letter-spacing: 1px; 
        }

        /* Responsive */
        @media (max-width: 1400px) {
            .global-kpis { grid-template-columns: repeat(2, 1fr); }
            .cedis-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 900px) {
            .cedis-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <header>
            <h1>MONITOREO <span>GERENCIAL</span></h1>
            <div id="date-tag" style="font-family: 'Inter'; color: var(--accent-data); font-size: 1.1vh; border: 1.5px solid var(--accent-data); padding: 4px 12px; border-radius: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">
                CIERRE: AYER
            </div>
        </header>

        <!-- KPIs Globales -->
        <div class="global-kpis">
            <div class="kpi-card" id="kpi-objetivo">
                <div class="kpi-label">Objetivo Quincenal</div>
                <div class="kpi-value" id="total-objetivo">$0</div>
                <div class="kpi-progress">
                    <div class="kpi-progress-fill data" style="width: 100%"></div>
                </div>
                <div class="kpi-delta">
                    <span class="delta-label">Meta total a alcanzar</span>
                </div>
            </div>
            
            <div class="kpi-card success" id="kpi-venta">
                <div class="kpi-label">Venta Alcanzada</div>
                <div class="kpi-value" id="total-venta">$0</div>
                <div class="kpi-progress">
                    <div class="kpi-progress-fill success" id="venta-progress" style="width: 0%"></div>
                </div>
                <div class="kpi-delta">
                    <span class="delta-value" id="delta-venta">0%</span>
                    <span class="delta-label">vs Objetivo</span>
                </div>
            </div>
            
            <div class="kpi-card warning" id="kpi-avance">
                <div class="kpi-label">Avance Global</div>
                <div class="kpi-value" id="global-perc">0%</div>
                <div class="kpi-progress">
                    <div class="kpi-progress-fill warning" id="avance-progress" style="width: 0%"></div>
                </div>
                <div class="kpi-delta">
                    <span class="delta-value" id="delta-avance">0%</span>
                    <span class="delta-label">vs Esperado: <strong id="global-expected">0%</strong></span>
                </div>
            </div>
            
            <div class="kpi-card danger" id="kpi-rescate">
                <div class="kpi-label">Meta Diaria de Rescate</div>
                <div class="kpi-value" id="total-rescue">$0</div>
                <div class="kpi-progress">
                    <div class="kpi-progress-fill danger" style="width: 100%"></div>
                </div>
                <div class="kpi-delta">
                    <span class="delta-label">Faltante por día para alcanzar meta</span>
                </div>
            </div>
        </div>

        <!-- Grid de CEDIS -->
        <div class="cedis-grid" id="cedis-grid"></div>

        <div class="source-footer">Source: SistemaCP | Powered by Inteligencia Comercial for Arbolito</div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxbA3JbYpdUJXXuUa3iicabHZ01QS98A610ugAgMRI7laj6B69ptMs6rG7Ot-pSIkaUe-stVIzL7BY/pub?gid=920388459&single=true&output=csv';

        function clean(v) { return v ? parseFloat(v.toString().replace(/[$, ]/g, '')) || 0 : 0; }
        
        // Formato inteligente: $1.63M, $127.9K, $1,234
        function fmtSmart(n) {
            if (n >= 1000000) return '$' + (n / 1000000).toFixed(2) + 'M';
            if (n >= 1000) return '$' + (n / 1000).toFixed(1) + 'K';
            return '$' + Math.round(n).toLocaleString('en-US');
        }
        
        function fmtPerc(n) { return n.toFixed(2) + '%'; }

        // Generar SVG sparkline
        function createSparkline(values, width = 280, height = 40, color = '#10b981') {
            if (values.length < 2) return '';
            
            const min = Math.min(...values);
            const max = Math.max(...values);
            const range = max - min || 1;
            const padding = 4;
            
            // Calcular puntos
            const points = values.map((v, i) => {
                const x = padding + (i / (values.length - 1)) * (width - padding * 2);
                const y = height - padding - ((v - min) / range) * (height - padding * 2);
                return { x, y, v };
            });
            
            // Crear path de línea
            const linePath = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x + ',' + p.y).join(' ');
            
            // Crear área debajo de la línea
            const areaPath = linePath + ` L${points[points.length - 1].x},${height} L${points[0].x},${height} Z`;
            
            // Punto final destacado
            const lastPoint = points[points.length - 1];
            const secondLast = points[points.length - 2];
            const isUp = lastPoint.v >= secondLast.v;
            const dotColor = isUp ? '#10b981' : '#ef4444';
            
            return `
                <svg class="sparkline-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
                    <defs>
                        <linearGradient id="grad-${color.replace('#', '')}" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/>
                            <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
                        </linearGradient>
                    </defs>
                    <path d="${areaPath}" fill="url(#grad-${color.replace('#', '')})" class="sparkline-area"/>
                    <path d="${linePath}" stroke="${color}" class="sparkline-line"/>
                    <circle cx="${lastPoint.x}" cy="${lastPoint.y}" r="3" fill="${dotColor}" stroke="#fff" stroke-width="1.5" class="sparkline-dot"/>
                </svg>
            `;
        }

        Papa.parse(csvUrl, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res) {
                const dataRaw = res.data;
                const h = Object.keys(dataRaw[0]);
                const findK = (terms) => h.find(k => terms.some(t => k.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().includes(t.toUpperCase())));
                const cKey = findK(['CEDIS']), rKey = findK(['RUTA']), zKey = findK(['ZONA']), vKey = findK(['ORGANICA']), oKey = findK(['OBJETIVO']), eKey = findK(['ESPERADA']), sKey = findK(['FALTANTES', 'CUOTA']);

                // Agrupar por CEDIS y guardar datos de rutas para sparklines
                const byCedis = dataRaw.reduce((acc, row) => {
                    const cedis = row[cKey]?.trim().toUpperCase();
                    if (!cedis || !row[rKey]?.trim()) return acc;
                    if (!acc[cedis]) acc[cedis] = { obj:0, vta:0, esp:0, sug:0, count:0, rutas: [] };
                    acc[cedis].obj += clean(row[oKey]);
                    acc[cedis].vta += clean(row[vKey]);
                    acc[cedis].esp += clean(row[eKey]);
                    acc[cedis].sug += clean(row[sKey]);
                    acc[cedis].count++;
                    acc[cedis].rutas.push({ nombre: row[rKey], venta: clean(row[vKey]), esperado: clean(row[eKey]) });
                    return acc;
                }, {});

                // Calcular totales globales
                let totalObj = 0, totalVta = 0, totalEsp = 0, totalSug = 0;
                Object.values(byCedis).forEach(d => {
                    totalObj += d.obj;
                    totalVta += d.vta;
                    totalEsp += d.esp;
                    totalSug += d.sug;
                });

                const globalPerc = totalObj > 0 ? (totalVta/totalObj)*100 : 0;
                const globalExp = totalObj > 0 ? (totalEsp/totalObj)*100 : 0;
                const gap = globalExp - globalPerc;

                // Actualizar KPIs globales
                document.getElementById('total-objetivo').innerText = fmtSmart(totalObj);
                document.getElementById('total-venta').innerText = fmtSmart(totalVta);
                document.getElementById('global-perc').innerText = fmtPerc(globalPerc);
                document.getElementById('total-rescue').innerText = fmtSmart(totalSug);
                document.getElementById('global-expected').innerText = fmtPerc(globalExp);
                
                // Barra de progreso venta
                document.getElementById('venta-progress').style.width = Math.min(globalPerc, 100) + '%';
                const ventaDeltaEl = document.getElementById('delta-venta');
                ventaDeltaEl.innerText = (globalPerc >= 100 ? '+' : '') + fmtPerc(globalPerc);
                ventaDeltaEl.style.color = globalPerc >= 100 ? 'var(--accent-success)' : 'var(--accent-alert)';
                
                // Barra de progreso avance
                document.getElementById('avance-progress').style.width = Math.min((globalPerc / globalExp) * 100, 100) + '%';
                const avanceDeltaEl = document.getElementById('delta-avance');
                avanceDeltaEl.innerText = (gap <= 0 ? '+' : '-') + fmtPerc(Math.abs(gap));
                avanceDeltaEl.style.color = gap <= 0 ? 'var(--accent-success)' : 'var(--accent-alert)';

                document.getElementById('kpi-avance').className = 'kpi-card ' + (globalPerc >= globalExp ? 'success' : 'warning');

                // Renderizar cards de CEDIS
                const grid = document.getElementById('cedis-grid');
                grid.innerHTML = '';

                Object.keys(byCedis).sort().forEach(cedis => {
                    const d = byCedis[cedis];
                    const perc = d.obj > 0 ? (d.vta/d.obj)*100 : 0;
                    const expPerc = d.obj > 0 ? (d.esp/d.obj)*100 : 0;
                    const gapCedis = expPerc - perc;
                    
                    let status, statusClass, cardClass, sparkColor;
                    if (perc >= expPerc) {
                        status = 'EN META'; statusClass = 'on-track'; cardClass = 'on-track';
                        sparkColor = '#10b981';
                    } else if (gapCedis < 5) {
                        status = 'RIESGO'; statusClass = 'warning'; cardClass = 'warning';
                        sparkColor = '#f59e0b';
                    } else {
                        status = 'CRÍTICO'; statusClass = 'critical'; cardClass = 'critical';
                        sparkColor = '#ef4444';
                    }

                    // Generar sparkline con datos de venta por ruta
                    const ventaValues = d.rutas.map(r => r.venta);
                    const sparklineHTML = createSparkline(ventaValues, 280, 40, sparkColor);

                    const bulletWidth = Math.min((perc / expPerc) * 100, 100);

                    const card = document.createElement('div');
                    card.className = `cedis-card ${cardClass}`;
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="cedis-name">${cedis}</div>
                            <span class="status-badge ${statusClass}">${status}</span>
                        </div>
                        
                        <!-- SPARKLINE: Tendencia de ventas por ruta -->
                        <div class="sparkline-container">
                            ${sparklineHTML}
                        </div>

                        <div class="bullet-container">
                            <div class="bullet-labels">
                                <span>Progreso</span>
                                <span style="color:${perc >= expPerc ? 'var(--accent-success)' : 'var(--accent-alert)'}; font-weight:600;">
                                    ${fmtPerc(perc)} / ${fmtPerc(expPerc)}
                                </span>
                            </div>
                            <div class="bullet-chart">
                                <div class="bullet-bar bullet-expected" style="width: 100%"></div>
                                <div class="bullet-bar bullet-actual ${perc < expPerc ? 'short' : ''}" style="width: ${bulletWidth}%"></div>
                            </div>
                        </div>

                        <div class="metrics-row">
                            <div class="metric">
                                <div class="metric-value goal">${fmtSmart(d.obj)}</div>
                                <div class="metric-label">Objetivo</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value sales ${perc >= expPerc ? 'on-target' : 'off-target'}">
                                    ${fmtSmart(d.vta)}
                                </div>
                                <div class="metric-label">Alcanzado</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value rescue">${fmtSmart(d.sug)}</div>
                                <div class="metric-label">Rescate/Día</div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
