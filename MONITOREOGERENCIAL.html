<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="300">
    <title>Monitoreo Gerencial - Arbolito</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        :root { 
            --bg: #f8fafc; 
            --panel: #ffffff; 
            --accent-data: #0669FE; 
            --accent-success: #29903B; 
            --accent-warning: #f59e0b;
            --accent-alert: #d63031; 
            --text-main: #0f172a; 
            --text-sub: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; cursor: none; }
        
        body { 
            height: 100vh; width: 100vw; background: var(--bg); color: var(--text-main); 
            font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; 
            overflow: hidden; 
            padding: 3vh 3vw;
        }
        
        #wrapper { width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 2vh; }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--panel); padding: 2vh 3vw; border-radius: 12px;
            box-shadow: var(--shadow);
        }
        h1 { font-family: 'Rubik', sans-serif; font-size: 2.5vh; font-weight: 900; letter-spacing: -0.5px; color: var(--text-main); text-transform: uppercase; }

        /* === KPIs GLOBALES === */
        .global-kpis { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 2vw; margin-bottom: 2vh;
        }
        .kpi-card {
            background: var(--panel); border-radius: 12px; padding: 2vh; 
            box-shadow: var(--shadow); text-align: center; position: relative;
            overflow: hidden; border-left: 4px solid var(--accent-data);
        }
        .kpi-card.success { border-left-color: var(--accent-success); }
        .kpi-card.warning { border-left-color: var(--accent-warning); }
        .kpi-card.danger { border-left-color: var(--accent-alert); }
        
        .kpi-card .icon { font-size: 3vh; margin-bottom: 1vh; }
        .kpi-card .value { font-family: 'Rubik'; font-size: 3.5vh; font-weight: 700; color: var(--text-main); margin: 1vh 0; }
        .kpi-card .label { font-size: 1vh; color: var(--text-sub); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .kpi-card .delta { 
            position: absolute; top: 1.5vh; right: 2vw; 
            font-size: 1.1vh; font-weight: 700; padding: 2px 8px; border-radius: 4px;
        }
        .delta.up { background: rgba(41, 144, 59, 0.1); color: var(--accent-success); }
        .delta.down { background: rgba(214, 48, 49, 0.1); color: var(--accent-alert); }

        /* === GRID DE CEDIS === */
        .cedis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 2vh;
            overflow-y: auto;
            padding-right: 1vh;
        }
        .cedis-grid::-webkit-scrollbar { width: 6px; }
        .cedis-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .cedis-card {
            background: var(--panel); border-radius: 12px; padding: 2.5vh;
            box-shadow: var(--shadow); position: relative;
            transition: all 0.3s ease; cursor: pointer;
            border: 2px solid transparent;
        }
        .cedis-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-color: var(--accent-data);
        }
        .cedis-card.critical { border-left: 4px solid var(--accent-alert); }
        .cedis-card.on-track { border-left: 4px solid var(--accent-success); }
        .cedis-card.warning { border-left: 4px solid var(--accent-warning); }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 2vh; padding-bottom: 1.5vh; border-bottom: 2px solid var(--border);
        }
        .cedis-name {
            font-family: 'Rubik'; font-size: 2vh; font-weight: 700; color: var(--text-main);
            display: flex; align-items: center; gap: 1vw;
        }
        .status-badge {
            padding: 4px 12px; border-radius: 20px; font-size: 1vh; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .status-badge.critical { background: rgba(214, 48, 49, 0.1); color: var(--accent-alert); }
        .status-badge.on-track { background: rgba(41, 144, 59, 0.1); color: var(--accent-success); }
        .status-badge.warning { background: rgba(245, 158, 11, 0.1); color: var(--accent-warning); }

        /* === BULLET CHART MINI === */
        .bullet-container { margin: 2vh 0; }
        .bullet-labels {
            display: flex; justify-content: space-between; font-size: 1vh;
            color: var(--text-sub); margin-bottom: 0.5vh; font-weight: 600;
        }
        .bullet-chart {
            height: 40px; background: var(--bg); border-radius: 6px;
            position: relative; overflow: hidden;
        }
        .bullet-bar {
            position: absolute; height: 100%; transition: width 0.5s ease;
        }
        .bullet-bg { background: #e2e8f0; width: 100%; }
        .bullet-expected { 
            background: repeating-linear-gradient(
                45deg,
                rgba(6, 105, 254, 0.2),
                rgba(6, 105, 254, 0.2) 10px,
                rgba(6, 105, 254, 0.3) 10px,
                rgba(6, 105, 254, 0.3) 20px
            );
            border-right: 3px solid var(--accent-data);
        }
        .bullet-actual {
            background: linear-gradient(90deg, var(--accent-success), #4ade80);
            z-index: 10;
        }
        .bullet-actual.short {
            background: linear-gradient(90deg, var(--accent-alert), #f87171);
        }

        /* === METRICS ROW === */
        .metrics-row {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.5vw;
            margin-top: 2vh; padding-top: 1.5vh; border-top: 1px solid var(--border);
        }
        .metric { text-align: center; }
        .metric-value {
            font-family: 'Rubik'; font-size: 1.8vh; font-weight: 700;
            color: var(--text-main); margin-bottom: 0.5vh;
        }
        .metric-label { font-size: 0.9vh; color: var(--text-sub); text-transform: uppercase; font-weight: 600; }
        .metric-value.rescue { color: var(--accent-data); }
        .metric-value.sales { color: var(--accent-success); }
        .metric-value.goal { color: var(--text-sub); }

        .link-detail {
            display: inline-block;
            margin-top: 1.5vh;
            padding: 8px 20px;
            background: var(--accent-data);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1.1vh;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        .link-detail:hover {
            background: #0550c7;
            transform: scale(1.05);
        }

        .source-footer { 
            text-align: center; font-size: 0.8vh; color: var(--text-sub); 
            font-weight: 700; padding: 1vh; text-transform: uppercase; letter-spacing: 1.5px; 
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .global-kpis { grid-template-columns: repeat(2, 1fr); }
            .cedis-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <header>
            <h1>📊 MONITOREO GERENCIAL - TODOS LOS CEDIS</h1>
            <div id="date-tag" style="font-family: 'Inter'; color: var(--accent-data); font-size: 1.2vh; border: 2px solid var(--accent-data); padding: 5px 15px; border-radius: 8px; font-weight: 700; text-transform: uppercase;">
                CIERRE: AYER
            </div>
        </header>

        <!-- KPIs Globales -->
        <div class="global-kpis">
            <div class="kpi-card" id="kpi-total-obj">
                <div class="icon">🎯</div>
                <div class="value" id="total-objetivo">$0</div>
                <div class="label">Objetivo Quincenal</div>
            </div>
            <div class="kpi-card success" id="kpi-total-vta">
                <div class="icon">💰</div>
                <div class="value" id="total-venta">$0</div>
                <div class="label">Venta Alcanzada</div>
                <div class="delta up" id="delta-venta">+0%</div>
            </div>
            <div class="kpi-card warning" id="kpi-global-perc">
                <div class="icon">📈</div>
                <div class="value" id="global-perc">0%</div>
                <div class="label">Avance Global</div>
                <div class="delta down" id="delta-perc">-0%</div>
            </div>
            <div class="kpi-card danger" id="kpi-total-rescue">
                <div class="icon">🚨</div>
                <div class="value" id="total-rescue">$0</div>
                <div class="label">Meta Diaria de Rescate</div>
            </div>
        </div>

        <!-- Grid de CEDIS -->
        <div class="cedis-grid" id="cedis-grid"></div>

        <div class="source-footer">SOURCE: SistemaCP | POWERED BY INTELIGENCIA COMERCIAL FOR ARBOLITO</div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxbA3JbYpdUJXXuUa3iicabHZ01QS98A610ugAgMRI7laj6B69ptMs6rG7Ot-pSIkaUe-stVIzL7BY/pub?gid=920388459&single=true&output=csv';

        function clean(v) { return v ? parseFloat(v.toString().replace(/[$, ]/g, '')) || 0 : 0; }
        function fmt(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
        function fmtPerc(n) { return n.toFixed(2) + '%'; }

        Papa.parse(csvUrl, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(res) {
                const dataRaw = res.data;
                const h = Object.keys(dataRaw[0]);
                const findK = (terms) => h.find(k => terms.some(t => k.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().includes(t.toUpperCase())));
                const cKey = findK(['CEDIS']), rKey = findK(['RUTA']), zKey = findK(['ZONA']), vKey = findK(['ORGANICA']), oKey = findK(['OBJETIVO']), eKey = findK(['ESPERADA']), sKey = findK(['FALTANTES', 'CUOTA']);

                // Agrupar TODOS los datos por CEDIS
                const byCedis = dataRaw.reduce((acc, row) => {
                    const cedis = row[cKey]?.trim().toUpperCase();
                    if (!cedis || !row[rKey]?.trim()) return acc;
                    if (!acc[cedis]) acc[cedis] = { obj:0, vta:0, esp:0, sug:0, count:0 };
                    acc[cedis].obj += clean(row[oKey]);
                    acc[cedis].vta += clean(row[vKey]);
                    acc[cedis].esp += clean(row[eKey]);
                    acc[cedis].sug += clean(row[sKey]);
                    acc[cedis].count++;
                    return acc;
                }, {});

                // Calcular totales globales
                let totalObj = 0, totalVta = 0, totalEsp = 0, totalSug = 0;
                Object.values(byCedis).forEach(d => {
                    totalObj += d.obj;
                    totalVta += d.vta;
                    totalEsp += d.esp;
                    totalSug += d.sug;
                });

                const globalPerc = totalObj > 0 ? (totalVta/totalObj)*100 : 0;
                const globalExp = totalObj > 0 ? (totalEsp/totalObj)*100 : 0;
                const gap = globalExp - globalPerc;

                // Actualizar KPIs globales
                document.getElementById('total-objetivo').innerText = fmt(totalObj);
                document.getElementById('total-venta').innerText = fmt(totalVta);
                document.getElementById('global-perc').innerText = fmtPerc(globalPerc);
                document.getElementById('total-rescue').innerText = fmt(totalSug);
                
                document.getElementById('delta-venta').innerText = (globalPerc >= globalExp ? '+' : '') + fmtPerc(globalPerc - globalExp);
                document.getElementById('delta-venta').className = 'delta ' + (globalPerc >= globalExp ? 'up' : 'down');
                
                document.getElementById('delta-perc').innerText = (gap >= 0 ? '-' : '+') + fmtPerc(Math.abs(gap));
                document.getElementById('delta-perc').className = 'delta ' + (gap <= 0 ? 'up' : 'down');

                document.getElementById('kpi-global-perc').className = 'kpi-card ' + (globalPerc >= globalExp ? 'success' : 'warning');

                // Renderizar cards de CEDIS
                const grid = document.getElementById('cedis-grid');
                grid.innerHTML = '';

                Object.keys(byCedis).sort().forEach(cedis => {
                    const d = byCedis[cedis];
                    const perc = d.obj > 0 ? (d.vta/d.obj)*100 : 0;
                    const expPerc = d.obj > 0 ? (d.esp/d.obj)*100 : 0;
                    const gapCedis = expPerc - perc;
                    
                    let status, statusClass, cardClass;
                    if (perc >= expPerc) {
                        status = 'EN META'; statusClass = 'on-track'; cardClass = 'on-track';
                    } else if (gapCedis < 5) {
                        status = 'RIESGO'; statusClass = 'warning'; cardClass = 'warning';
                    } else {
                        status = 'CRÍTICO'; statusClass = 'critical'; cardClass = 'critical';
                    }

                    const bulletWidth = Math.min((perc / expPerc) * 100, 100);

                    const card = document.createElement('div');
                    card.className = `cedis-card ${cardClass}`;
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="cedis-name">
                                <span style="font-size:2.5vh;">🏭</span>
                                ${cedis}
                            </div>
                            <span class="status-badge ${statusClass}">${status}</span>
                        </div>
                        
                        <div class="bullet-container">
                            <div class="bullet-labels">
                                <span>Progreso vs Esperado</span>
                                <span style="color:${perc >= expPerc ? 'var(--accent-success)' : 'var(--accent-alert)'}; font-weight:700;">
                                    ${fmtPerc(perc)} de ${fmtPerc(expPerc)}
                                </span>
                            </div>
                            <div class="bullet-chart">
                                <div class="bullet-bar bullet-bg"></div>
                                <div class="bullet-bar bullet-expected" style="width: 100%"></div>
                                <div class="bullet-bar bullet-actual ${perc < expPerc ? 'short' : ''}" style="width: ${bulletWidth}%"></div>
                            </div>
                        </div>

                        <div class="metrics-row">
                            <div class="metric">
                                <div class="metric-value goal">${fmt(d.obj)}</div>
                                <div class="metric-label">Objetivo</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value sales" style="color:${perc >= expPerc ? 'var(--accent-success)' : 'var(--accent-alert)'}">
                                    ${fmt(d.vta)}
                                </div>
                                <div class="metric-label">Alcanzado</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value rescue">${fmt(d.sug)}</div>
                                <div class="metric-label">Rescate/Día</div>
                            </div>
                        </div>

                        <div style="text-align: center;">
                            <a href="?cedis=${cedis}" class="link-detail">Ver Detalle por Rutas →</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
